# Built-in detection lists. Extend them without rebuilding through the
# root-owned rules file passed to the daemon with -rules.

registries:
  - registry.npmjs.org
  - registry.yarnpkg.com
  - npm.pkg.github.com
  - pypi.org
  - files.pythonhosted.org
  - proxy.golang.org
  - sum.golang.org
  - crates.io
  - static.crates.io
  - index.crates.io
  - rubygems.org
  - index.rubygems.org
  - formulae.brew.sh
  - ghcr.io
  - pkg-containers.githubusercontent.com
  - repo.packagist.org
  - packagist.org

suspicious_domains:
  - pastebin.com
  - paste.ee
  - hastebin.com
  - ghostbin.com
  - transfer.sh
  - discord.com
  - discordapp.com
  - api.telegram.org
  - ngrok.io
  - ngrok-free.app
  - ngrok.app
  - trycloudflare.com
  - loca.lt
  - serveo.net
  - webhook.site
  - pipedream.net
  - requestbin.net
  - interact.sh
  - oast.fun

sensitive_paths:
  - /.ssh/
  - /.aws/
  - /.azure/
  - /.config/gcloud/
  - /.config/gh/
  - /.docker/config.json
  - /.kube/config
  - /.gnupg/
  - /.npmrc
  - /.pypirc
  - /.netrc
  - /.git-credentials
  - /Library/Keychains/

sensitive_names:
  - .env
  - .env.*
  - id_rsa*
  - id_ed25519*
  - "*.pem"

# A tool reading its own credentials is normal: ssh reading ~/.ssh during a
# git push, gh reading its token. Reads by anything else still count.
credential_owners:
  ssh: [/.ssh/]
  scp: [/.ssh/]
  sftp: [/.ssh/]
  ssh-add: [/.ssh/]
  git: [/.git-credentials, /.ssh/]
  git-remote-https: [/.git-credentials, /.netrc]
  gh: [/.config/gh/]
  aws: [/.aws/]
  gcloud: [/.config/gcloud/]
  az: [/.azure/]
  docker: [/.docker/config.json]
  kubectl: [/.kube/config]
  npm: [/.npmrc]
  pnpm: [/.npmrc]
  yarn: [/.npmrc]
  pip: [/.pypirc, /.netrc]
  twine: [/.pypirc]
  gpg: [/.gnupg/]

downloaders:
  - curl
  - wget
  - powershell
  - pwsh

shells:
  - bash
  - zsh

# Programs that start a monitored session on their own, so installs, agents
# and app runs are covered without typing `contraband run`. Matched on the
# executable and on the names it was invoked as (npm runs as node).
auto_sessions:
  - npm
  - npx
  - pnpm
  - yarn
  - bun
  - pip
  - pip3
  - uv
  - cargo
  - brew
  - gem
  - bundle
  - composer
  - go
  - git
  - gh
  - claude
  - node
  - python
  - python3

# AI agents fetch arbitrary pages while researching, so their own traffic is
# not compared with the previous run; packages they install still are.
agents:
  - claude
  - codex
  - gemini
  - aider
  - cursor-agent

# Enforcement for automatic sessions:
#   off     monitor only
#   risk    stop a process once its session reaches ALERT (e.g. credentials
#           read, then sent to a raw IP); unknown domains are fine
#   strict  stop any process that connects somewhere not approved, not a
#           package registry and not local
# Only settable here, in a root-owned file, so the code being watched cannot
# turn it off.
enforce_auto_sessions: off
